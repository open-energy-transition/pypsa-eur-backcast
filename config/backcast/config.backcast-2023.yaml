run:
  name: backcast-2023

planning_horizons: [2023]

snapshots:
  start: "2023-01-01"
  end: "2024-01-01"

sector:
  enabled: false

atlite:
  default_cutout: europe-2023-sarah3-era5

electricity:
  extendable_carriers:
    Generator: []
    StorageUnit: []
    Store: []
    Link: []
  transmission_limit: v1.0
  cross_border_capacities: ntc
  powerplants_filter: "(DateOut >= 2023 or DateOut != DateOut) and (DateIn <= 2023 or DateIn != DateIn) and not (Country == 'NL' and Name in ['Magnum Eemshaven', 'Claus', 'Eem', 'Velsen'])"
  custom_powerplants: "Country == 'NL' and (DateOut >= 2023 or DateOut != DateOut) and (DateIn <= 2023 or DateIn != DateIn)"
  estimate_renewable_capacities:
    from_powerplantmatching: false
    from_irenastat: true
    year: 2023

renewable:
  hydro:
    flatten_dispatch: true
    flatten_dispatch_buffer: 0.2
    PHS_max_hours_cap: geth2015

conventional:
  dynamic_fuel_price: true
  fuel_price_rolling_window: 1
  fuel_price_nominal: true
  estimate_efficiencies:
    enable: true
    reference_year: 2023
  nuclear:
    p_min_pu: 0.3
  lignite:
    p_min_pu: 0.3
  biomass:
    p_min_pu: 0.3
  waste:
    p_min_pu: 0.5
  marginal_cost_spread:
    enable: true
    carriers: [CCGT, OCGT, coal, lignite, oil]
    spread: 0.45
    utilisation: 0.35
    reference: observed
    exclude_areas: [IE_SEM]
  gas_price_cap:
    enable: true
    countries: [ES, PT]
    cap:
      "2023-01-01": 45
      "2023-01-14": 50
      "2023-02-14": 55
      "2023-03-14": 60
      "2023-04-14": 65
      "2023-06-01": 70

costs:
  year: 2020
  custom_cost_fn: config/backcast/custom_costs.backcast-2023.csv
  emission_prices:
    dynamic: true
    rolling_window: 1

transmission_projects:
  enable: false

lines:
  under_construction: zero

links:
  under_construction: zero

co2_budget:
  relative: false
  upper:
  lower:

clustering:
  mode: administrative
  administrative:
    level: bz
  build_bidding_zones:
    remove_islands: true
  copperplate_regions:
  - [DE00, LUG1]
  - [GBNI, IE00]
  consider_efficiency_classes: true
  cluster_network:
    allow_ac_dc_mixing_in_bus_clusters: true

solving:
  options:
    load_shedding:
      enable: true
      default_cost: 4000
    noisy_costs: false

backcast:
  exclude_price_areas: [AL, BA, GB, ME, MK, XK]
  exclude_price_buses: [FR15]
  max_price_gap_hours_by_area:
    IE_SEM: 25
  fixed_border_capacities:
    DK_1-GB: 0
    FI-SE_2: 0
    IT_CALA-IT_CSUD: physical
    FR-IT_CNOR: physical
    FR-IT_SARD: physical
  exchange_proxy_borders: [BE-NL, DE_LU-NL]
  exclude_generation_areas: [AL, GB]
  calibrate_wind: true
  wind_calibration_exclude:
    BA: [onwind]
    CH: [onwind]
    ES: [offwind]
    FR: [offwind]
    HR: [onwind]
    IT_CALA: [onwind]
    IT_CNOR: [onwind]
    IT_CSUD: [onwind]
    IT_NORD: [onwind]
    IT_SICI: [onwind]
    IT_SUD: [onwind, offwind]
    ME: [onwind]
    MK: [onwind]
    NL: [onwind]
    NO_2: [onwind]
    NO_3: [onwind]
    NO_5: [onwind]
    SI: [onwind]
    XK: [onwind]
  wind_calibration_factor_bounds: [0.35, 2.0]
  wind_target_twh:
    GB: {onwind: 29.7, offwind: 49.6}  # DESNZ ET 6.1 UK minus NI wind 2.77 TWh (DfE NI renewable generation statistics 2023)
  wind_curtailment_twh:
    DE_LU: {onwind: 6, offwind: 4}
  monthly_nuclear_availability: true
  nuclear_phase_out:
    DE_LU: "2023-04-15"
  unavailability:
    enable: true
  hybrid_capacities:
    enable: true
    physical_factor: 0.49
    dc_physical_factor: 0.7
    sources: [scheduled_exchange]
    areas: [AT, BE, CZ, DE_LU, FR, HR, HU, NL, PL, RO, SI, SK]
