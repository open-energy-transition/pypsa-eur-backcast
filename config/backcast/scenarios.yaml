    wind_curtailment_twh:
      DE_LU: {onwind: 4.0, offwind: 5.7}  # BNetzA Netzengpassmanagement Gesamtjahr 2023: onshore 3980 GWh, offshore 5729 GWh (closes #37)
    energy_budget_carriers: [biomass]  # annual biomass generation as e_sum_max per budget area (plan item 1.3)
    energy_budget_eurostat: [biomass]  # e_sum_max raised to Eurostat nrg_bal_peh gross biomass electricity (BIOE - W6210) where it exceeds ENTSO-E, as ENTSO-E misses autoproducer and small CHP biomass; dev/backcast-accuracy/p1-retune/biomass/diagnosis.md option A
    energy_budget_monthly_ceiling: false  # the annual cap alone, the monthly ENTSO-E p_max_pu ceiling would cap the raised budget again
    solar_unpublished: true  # grid-fed PV missing from ENTSO-E in data/solar_unpublished.csv, computed with the biomass budget raised to Eurostat (plan item 1.4)
    monthly_availability_exclude:
      biomass: [BG, DK_1, DK_2, EE, IT_CALA, IT_CNOR, IT_CSUD, IT_NORD, IT_SARD, IT_SICI, IT_SUD, LV, NL, PL, SI]  # ENTSO-E biomass below half of Eurostat nrg_bal_peh main-activity biomass electricity or load - generation - net scheduled imports above 5 % of load, dev/backcast-accuracy/p1-nuclear-biomass/coverage_2023.csv
    nuclear_phase_out:
      DE_LU: "2023-04-15"
    unavailability:
      enable: true

backcast-2024:
  snapshots:
    start: "2024-01-01"
    end: "2025-01-01"

  atlite:
    default_cutout: europe-2024-sarah3-era5

  load:
    supplement_synthetic: false  # synthetic load ends in 2023; ENTSO-E 2024 load has no gaps after the manual adjustments

  electricity:
    powerplants_filter: "(DateOut >= 2024 or DateOut != DateOut) and (DateIn <= 2024 or DateIn != DateIn) and not (Country == 'NL' and Name in ['Magnum Eemshaven', 'Claus', 'Eem', 'Velsen']) and not (Country == 'FI' and (Fueltype in ['Lignite', 'Nuclear'] or Name in ['Toppila Ja', 'Seinajoki', 'Haapaniemen', 'Keljonlahti', 'Alholmens Kraft', 'Kemi Bioproduct Mill', 'Naantali Chp'])) and not (Country == 'BA' and Name in ['Capljina', 'Gacko', 'Kakanj', 'Tuzla', 'Ugljevik']) and not (Country == 'EE' and Name in ['Kiisa Erpp', 'Iru Elektrijaam']) and not (Country == 'SE' and Name in ['Stenungsund', 'Nya Oresundsverket', 'Oresundsverket'])"
    custom_powerplants: "Country in ['NL', 'EE', 'FI', 'BA'] and (DateOut >= 2024 or DateOut != DateOut) and (DateIn <= 2024 or DateIn != DateIn)"
    estimate_renewable_capacities:
      year: 2024

  conventional:
    estimate_efficiencies:
      reference_year: 2024

  backcast:
    exclude_price_areas: [AL, BA, GB, ME, MK, XK]
    fixed_border_capacities:
      IT_CALA-IT_CSUD: physical
    exchange_proxy_fallback: true  # Nordic offered capacities end with flow-based market coupling on 2024-10-29, DE_LU-DK_2 NTC after February, DE_LU-SE_4 offered capacity after 2024-06-20
    exclude_generation_areas: [AL, GB]
    wind_calibration_exclude:
      IT_CALA: [onwind]
    wind_calibration_factor_bounds: [0.3, 2.0]  # DK_2 onwind needs 0.34 (2023: 0.38, 2019: 0.46)
    wind_target_twh:
      GB: {onwind: 32.1, offwind: 48.5}  # DESNZ DUKES 2025 UK minus NI wind 2.59 TWh (DfE NI renewable generation statistics 2024: 2585 GWh)
    wind_curtailment_twh:
      DE_LU: {onwind: 3.4, offwind: 4.6}  # BNetzA Netzengpassmanagement Gesamtjahr 2024: onshore 3384 GWh, offshore 4562 GWh
    energy_budget_carriers: [biomass]  # annual biomass generation as e_sum_max per budget area (plan item 1.3)
    energy_budget_eurostat: [biomass]  # e_sum_max raised to Eurostat nrg_bal_peh gross biomass electricity (BIOE - W6210) where it exceeds ENTSO-E, as ENTSO-E misses autoproducer and small CHP biomass; dev/backcast-accuracy/p1-retune/biomass/diagnosis.md option A
    energy_budget_monthly_ceiling: false  # the annual cap alone, the monthly ENTSO-E p_max_pu ceiling would cap the raised budget again
    solar_unpublished: true  # grid-fed PV missing from ENTSO-E in data/solar_unpublished.csv, computed with the biomass budget raised to Eurostat (plan item 1.4)
    monthly_availability_exclude:
      biomass: [BG, EE, IT_CALA, IT_CNOR, IT_CSUD, IT_NORD, IT_SARD, IT_SICI, IT_SUD, LT, NL, PL]  # ENTSO-E biomass below half of Eurostat nrg_bal_peh main-activity biomass electricity or load - generation - net scheduled imports above 5 % of load, dev/backcast-accuracy/p1-nuclear-biomass/coverage_2024.csv

backcast-2025:
  snapshots:
    start: "2025-01-01"
    end: "2026-01-01"

  atlite:
    default_cutout: europe-2025-sarah3-era5

  load:
    supplement_synthetic: false  # synthetic load ends in 2023

  electricity:
    powerplants_filter: "(DateOut >= 2025 or DateOut != DateOut) and (DateIn <= 2025 or DateIn != DateIn) and not (Country == 'NL' and Name in ['Magnum Eemshaven', 'Claus', 'Eem', 'Velsen']) and not (Country == 'FI' and (Fueltype in ['Lignite', 'Nuclear'] or Name in ['Toppila Ja', 'Seinajoki', 'Haapaniemen', 'Keljonlahti', 'Alholmens Kraft', 'Kemi Bioproduct Mill', 'Naantali Chp'])) and not (Country == 'BA' and Name in ['Capljina', 'Gacko', 'Kakanj', 'Tuzla', 'Ugljevik']) and not (Country == 'EE' and Name in ['Kiisa Erpp', 'Iru Elektrijaam']) and not (Country == 'SE' and Name in ['Stenungsund'])"
    custom_powerplants: "Country in ['NL', 'EE', 'FI', 'BA'] and (DateOut >= 2025 or DateOut != DateOut) and (DateIn <= 2025 or DateIn != DateIn)"
    estimate_renewable_capacities:
      year: 2025
      irenastat_source: retrieve

  conventional:
    estimate_efficiencies:
      reference_year: 2025

  backcast:
    chp_floor:
      year: 2024  # Eurostat nrg_bal_peh has no 2025 data yet
    exclude_price_areas: [AL, BA, GB, ME, MK, XK]
    fixed_border_capacities:
      IT_CALA-IT_CSUD: physical
    exchange_proxy_fallback: true  # no Nordic capacities are published in 2025 (flow-based market coupling since 2024-10-29), the DE_LU-DK_2 NTC ends in 2024
    exchange_proxy_by_direction_areas: [DK_1, DK_2, FI, NO_1, NO_2, NO_3, NO_4, NO_5, SE_1, SE_2, SE_3, SE_4]  # Nordic flow-based region
    exclude_generation_areas: [AL, GB]
    wind_calibration_exclude:
      IT_CALA: [onwind]
    wind_calibration_factor_bounds: [0.3, 2.1]  # AT onwind needs 2.06 (2020: 2.02), DK_2 onwind is low in every year (2024: 0.34)
    wind_target_twh:
      # DESNZ DUKES 2026 Table 6.2 UK onshore 34.42, offshore 52.02 TWh, minus NI wind 2.76 TWh. The old metered DfE NI series ends in
      # 2025-09: Jan-Sep 1895 GWh plus Oct-Dec 921 GWh of the new consumption basis times 0.94, the old to new ratio of Jan-Sep.
      GB: {onwind: 31.7, offwind: 52.0}
    wind_curtailment_twh:
      DE_LU: {onwind: 3.2, offwind: 3.4}  # BNetzA Netzengpassmanagement Gesamtjahr 2025 (SMARD, 2026-03-30, provisional): onshore 3225 GWh, offshore 3351 GWh
