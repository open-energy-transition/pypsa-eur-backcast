# Backcast years as scenarios of config/backcast/config.backcast.yaml, run with `pixi run backcast <year>`.
# Each entry holds only what differs by year: the snapshots, cutout and year filters, the year facts
# with their sources, and the settings for gaps in the ENTSO-E data of that year.
# The planning horizon is the year and is set by the pixi task, as it cannot vary between scenarios.

backcast-2019: &backcast-2019
  snapshots:
    start: "2019-01-01"
    end: "2020-01-01"

  atlite:
    default_cutout: europe-2019-sarah3-era5

  electricity:
    powerplants_filter: "(DateOut >= 2019 or DateOut != DateOut) and (DateIn <= 2019 or DateIn != DateIn) and not (Country == 'NL' and Name in ['Magnum Eemshaven', 'Claus', 'Eem', 'Velsen'])"
    custom_powerplants: "Country == 'NL' and (DateOut >= 2019 or DateOut != DateOut) and (DateIn <= 2019 or DateIn != DateIn)"
    estimate_renewable_capacities:
      year: 2019

  conventional: &backcast-2019-conventional
    estimate_efficiencies:
      reference_year: 2019
    # THE daily prices start in 2021-10, so other countries keep the monthly price.
    daily_gas_price:
      enable: true
      default_hub:
      hubs:
        ES: MIBGAS
        PT: MIBGAS

  backcast: &backcast-2019-backcast
    area_to_bus: data/entsoe_area_to_bus-pre2021.csv
    borders: data/entsoe_borders-pre2021.csv
    exclude_price_areas: [AL, BA, BG, GB, ME, MK, PL, RO, XK]
    max_capacity_gap_hours: 720
    fixed_border_capacities:
      AL-XK: physical
      BE-DE_LU: 0
      BG-MK: physical
      DE_LU-NO_2: 0
      DK_1-GB: 0
      DK_1-NL: 0
      GB-NO_2: 0
      HU-SI: 0
      IT_CSUD-IT_ROSN: physical
      IT_CSUD-ME: 0
      ME-XK: physical
      MK-XK: physical
      RS-XK: physical
    exclude_generation_areas: [AL, GB, SE_3, SE_4, XK]
    wind_calibration_exclude:
      RO: [onwind]
    wind_calibration_factor_bounds: [0.35, 2.0]
    wind_target_twh:
      GB: {onwind: 29.4, offwind: 31.9}  # DESNZ DUKES UK minus NI wind 2.85 TWh (DfE NI renewable generation statistics 2019)
    wind_curtailment_twh:
      DE_LU: {onwind: 5.1, offwind: 1.2}

backcast-2019-plain:  # unrefined 2019 reference: 2019 without the hydro, must-run, cost spread, wind, nuclear and hybrid capacity refinements
  <<: *backcast-2019
  renewable:
    hydro:
      flatten_dispatch: false
  conventional:
    <<: *backcast-2019-conventional
    nuclear:
      p_min_pu: 0
    lignite:
      p_min_pu: 0
    biomass:
      p_min_pu: 0
    waste:
      p_min_pu: 0
    marginal_cost_spread:
      enable: false
  costs:
    custom_cost_fn: data/custom_costs.csv
  backcast:
    <<: *backcast-2019-backcast
    calibrate_wind: false
    monthly_nuclear_availability: false
    hybrid_capacities:
      enable: false

backcast-2022:
  snapshots:
    start: "2022-01-01"
    end: "2023-01-01"

  atlite:
    default_cutout: europe-2022-sarah3-era5

  electricity:
    powerplants_filter: "(DateOut >= 2022 or DateOut != DateOut) and (DateIn <= 2022 or DateIn != DateIn) and not (Country == 'NL' and Name in ['Magnum Eemshaven', 'Claus', 'Eem', 'Velsen'])"
    custom_powerplants: "Country == 'NL' and (DateOut >= 2022 or DateOut != DateOut) and (DateIn <= 2022 or DateIn != DateIn)"
    estimate_renewable_capacities:
      year: 2022

  conventional:
    estimate_efficiencies:
      reference_year: 2022
    gas_price_cap:  # Iberian exception, Real Decreto-ley 10/2022: 40 EUR/MWh from 2022-06-15 for six months, then 5 EUR/MWh more per month
      enable: true
      countries: [ES, PT]
      cap:
        "2022-06-15": 40
        "2022-12-14": 45

  backcast:
    exclude_price_areas: [AL, BA, BG, GB, ME, MK, XK]  # BG day-ahead prices are published partly in BGN in 2022
    fixed_border_capacities:
      BG-MK: physical  # no ENTSO-E capacity data before 2022-06-15
      DK_1-GB: 0
      HU-SI: 0  # no ENTSO-E capacity or exchange data before Core flow-based market coupling on 2022-06-08
      IT_CALA-IT_CSUD: physical
    exchange_proxy_fallback: true  # Core NTCs end with flow-based market coupling on 2022-06-08, EE-FI, EE-LV and HU-RO offered capacities have gaps of 8 to 16 days
    exclude_generation_areas: [AL, GB]
    wind_calibration_exclude:
      IT_CALA: [onwind]
      RS: [onwind]  # factor 2.93, ENTSO-E RS wind generation is published only from 2022-03
    wind_calibration_factor_bounds: [0.35, 2.0]
    wind_target_twh:
      GB: {onwind: 31.8, offwind: 45.1}  # DESNZ ET 6.1 (Sep 2026) UK minus NI wind 3.26 TWh (DfE NI renewable generation statistics 2022: 3825 GWh, 85.3 % wind)
    wind_curtailment_twh:
      DE_LU: {onwind: 3.2, offwind: 4.2}  # BNetzA Bericht Netzengpassmanagement Gesamtjahr 2022, Tabelle 7: onshore 3186 GWh, offshore 4153 GWh

backcast-2023:
  snapshots:
    start: "2023-01-01"
    end: "2024-01-01"

  atlite:
    default_cutout: europe-2023-sarah3-era5

  electricity:
    powerplants_filter: "(DateOut >= 2023 or DateOut != DateOut) and (DateIn <= 2023 or DateIn != DateIn) and not (Country == 'NL' and Name in ['Magnum Eemshaven', 'Claus', 'Eem', 'Velsen'])"
    custom_powerplants: "Country == 'NL' and (DateOut >= 2023 or DateOut != DateOut) and (DateIn <= 2023 or DateIn != DateIn)"
    estimate_renewable_capacities:
      year: 2023

  conventional:
    estimate_efficiencies:
      reference_year: 2023
    gas_price_cap:
      enable: true
      countries: [ES, PT]
      cap:
        "2023-01-01": 45
        "2023-01-14": 50
        "2023-02-14": 55
        "2023-03-14": 60
        "2023-04-14": 65
        "2023-06-01": 70
    daily_gas_price:
      enable: true
      default_hub: THE
      hubs:
        ES: MIBGAS
        PT: MIBGAS

  backcast:
    exclude_price_areas: [AL, BA, GB, ME, MK, XK]
    fixed_border_capacities:
      DK_1-GB: 0
      IT_CALA-IT_CSUD: physical
    exclude_generation_areas: [AL, GB]
    wind_calibration_exclude:
      IT_CALA: [onwind]
    wind_calibration_factor_bounds: [0.35, 2.0]
    wind_target_twh:
      GB: {onwind: 29.7, offwind: 49.6}  # DESNZ ET 6.1 UK minus NI wind 2.77 TWh (DfE NI renewable generation statistics 2023)
    wind_curtailment_twh:
      DE_LU: {onwind: 6, offwind: 4}
    nuclear_phase_out:
      DE_LU: "2023-04-15"
