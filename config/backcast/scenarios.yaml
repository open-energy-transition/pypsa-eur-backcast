# Backcast years as scenarios of config/backcast/config.backcast.yaml, run with `pixi run backcast <year>`.
# Each entry holds only what differs by year: the snapshots, cutout and year filters, the year facts
# with their sources, and the settings for gaps in the ENTSO-E data of that year.
# The planning horizon is the year and is set by the pixi task, as it cannot vary between scenarios.

backcast-2019: &backcast-2019
  snapshots:
    start: "2019-01-01"
    end: "2020-01-01"

  atlite:
    default_cutout: europe-2019-sarah3-era5

  electricity:
    # FI peat and nuclear (including the peat CHPs that powerplantmatching labels Solid Biomass), BA Capljina and lignite, EE Iru rows are replaced by data/custom_powerplants.csv (ENTSO-E 14.1.B); the other FI biomass stays from powerplantmatching, as the ENTSO-E 16.1.A FI biomass total (1.83 GW) is far below it. FI: Kemi Bioproduct Mill is replaced by Metsa Fibre Kemi from 2023. EE: Kiisa is an Elering emergency reserve that does not bid into the day-ahead market, so powerplantmatching Kiisa Erpp is dropped in every year without replacement. FI: Naantali switched from hard coal (14.1.B B05 471 MW in 2019-2020) to biomass (B01 201 MW), so powerplantmatching Naantali Chp is dropped from 2021 (16.1.A FI hard coal 2163 MW in 2020, 1682 MW in 2021). SE: Stenungsund is out of operation since 2017 (https://group.vattenfall.com/press-and-media/newsroom/2017/the-hidden-power-plant/) and the Oresundsverket site (Nya Oresundsverket and the old Oresundsverket oil unit) was mothballed from 2017 until 2025 (https://www.uniper.energy/sverige/nyheter/oeresundsverket-tillbaka-i-drift-efter-atta-ar/), neither counts in the Swedish fossil capacity of Energiforetagen, Energiaret tabell 2 (https://www.energiforetagen.se/496178/globalassets/energiforetagen/statistik/energiaret/2023/energiaret-2023_tabeller.pdf).
    powerplants_filter: "(DateOut >= 2019 or DateOut != DateOut) and (DateIn <= 2019 or DateIn != DateIn) and not (Country == 'NL' and Name in ['Magnum Eemshaven', 'Claus', 'Eem', 'Velsen']) and not (Country == 'FI' and (Fueltype in ['Lignite', 'Nuclear'] or Name in ['Toppila Ja', 'Seinajoki', 'Haapaniemen', 'Keljonlahti', 'Alholmens Kraft'])) and not (Country == 'BA' and Name in ['Capljina', 'Gacko', 'Kakanj', 'Tuzla', 'Ugljevik']) and not (Country == 'EE' and Name in ['Kiisa Erpp', 'Iru Elektrijaam']) and not (Country == 'SE' and Name in ['Stenungsund', 'Nya Oresundsverket', 'Oresundsverket'])"
    custom_powerplants: "Country in ['NL', 'EE', 'FI', 'BA'] and (DateOut >= 2019 or DateOut != DateOut) and (DateIn <= 2019 or DateIn != DateIn)"
    estimate_renewable_capacities:
      year: 2019

  conventional: &backcast-2019-conventional
    estimate_efficiencies:
      reference_year: 2019
    # THE daily prices start in 2021-10, so other countries keep the monthly price.
    daily_gas_price:
      enable: true
      default_hub:
      hubs:
        ES: MIBGAS
        PT: MIBGAS

  backcast: &backcast-2019-backcast
    area_to_bus: data/entsoe_area_to_bus-pre2021.csv
    borders: data/entsoe_borders-pre2021.csv
    exclude_price_areas: [AL, BA, ME, MK, XK]
    max_price_gap_hours_by_area:
      GB: 24  # ENTSO-E publishes no GB day-ahead price for 2019-06-08
    max_capacity_gap_hours: 720
    fixed_border_capacities:
      AL-XK: physical
      BE-DE_LU: 0
      BG-MK: physical
      DE_LU-NO_2: 0
      DK_1-GB: 0
      DK_1-NL: 0
      GB-NO_2: 0
      HU-SI: 0
      IT_CSUD-IT_ROSN: physical
      IT_CSUD-ME: 0
      ME-XK: physical
      MK-XK: physical
      RS-XK: physical
    exclude_generation_areas: [AL, GB, SE_3, SE_4, XK]
    solar_calibration_exclude: [AT, BA, CH, GR, HR, IE_SEM, LV, ME, MK, NL, SE_1, SE_2, SI, EE, IT_ROSN]  # solar_calibration_exclude of config.backcast.yaml (keep in sync) plus EE 0.08, IT_ROSN 0.04
    wind_calibration_exclude:
      RO: [onwind]
    wind_calibration_factor_bounds: [0.35, 2.0]
    wind_target_twh:
      GB: {onwind: 29.4, offwind: 31.9}  # DESNZ DUKES UK minus NI wind 2.85 TWh (DfE NI renewable generation statistics 2019)
    wind_curtailment_twh:
      DE_LU: {onwind: 5.1, offwind: 1.2}
    energy_budget_carriers: [biomass]  # annual biomass generation as e_sum_max per budget area (plan item 1.3)
    energy_budget_eurostat: [biomass]  # e_sum_max raised to Eurostat nrg_bal_peh gross biomass electricity (BIOE - W6210) where it exceeds ENTSO-E, as ENTSO-E misses autoproducer and small CHP biomass; dev/backcast-accuracy/p1-retune/biomass/diagnosis.md option A
    energy_budget_monthly_ceiling: false  # the annual cap alone, the monthly ENTSO-E p_max_pu ceiling would cap the raised budget again
    solar_unpublished: true  # grid-fed PV missing from ENTSO-E in data/solar_unpublished.csv, computed with the biomass budget raised to Eurostat (plan item 1.4)
    external_flows:
      areas: [UA, TR, RU, RU_KGD, BY]  # MD dropped: ENTSO-E publishes no RO-MD scheduled exchanges or physical flows in 2019 (logs/retrieve_cross_border_capacities_entsoe_2019_RO-MD.log)
    monthly_availability_exclude:
      biomass: [BE, BG, DK_1, DK_2, EE, FI, HR, HU, IT_CNOR, IT_CSUD, IT_NORD, IT_SARD, IT_SICI, IT_SUD, LT, LV, NL, PL, RS]  # ENTSO-E biomass below half of Eurostat nrg_bal_peh main-activity biomass electricity or load - generation - net scheduled imports above 5 % of load, dev/backcast-accuracy/p1-nuclear-biomass/coverage_2019.csv

backcast-2019-plain:  # unrefined 2019 reference: 2019 without flattened hydro dispatch, must-run minima, CHP floor, cost spread, custom backcast costs, wind and solar calibration, monthly nuclear availability, nuclear minimum output, biomass energy budget, unpublished solar, nuclear fuel price override, hybrid capacities and external flows; keeps the fleet corrections of the powerplant filters
  <<: *backcast-2019
  renewable:
    hydro:
      flatten_dispatch: false
  conventional:
    <<: *backcast-2019-conventional
    nuclear:
      p_min_pu: 0
    lignite:
      p_min_pu: 0
    biomass:
      p_min_pu: 0
    waste:
      p_min_pu: 0
    marginal_cost_spread:
      enable: false
  costs:
    custom_cost_fn: data/custom_costs.csv
  backcast:
    <<: *backcast-2019-backcast
    calibrate_wind: false
    calibrate_solar: false
    monthly_nuclear_availability: false
    nuclear_min_output: false
    energy_budget_carriers: []
    energy_budget_eurostat: []
    solar_unpublished: false
    chp_floor:
      enable: false
    hybrid_capacities:
      enable: false
    external_flows:
      enable: false
    fuel_price:  # technology data v0.15.0 costs_2020 value, as an empty mapping does not clear the inherited nuclear price under the recursive scenario merge
      nuclear: 7.4536

backcast-2020:
  snapshots:
    start: "2020-01-01"
    end: "2021-01-01"

  atlite:
    default_cutout: europe-2020-sarah3-era5

  electricity:
    powerplants_filter: "(DateOut >= 2020 or DateOut != DateOut) and (DateIn <= 2020 or DateIn != DateIn) and not (Country == 'NL' and Name in ['Magnum Eemshaven', 'Claus', 'Eem', 'Velsen']) and not (Country == 'FI' and (Fueltype in ['Lignite', 'Nuclear'] or Name in ['Toppila Ja', 'Seinajoki', 'Haapaniemen', 'Keljonlahti', 'Alholmens Kraft'])) and not (Country == 'BA' and Name in ['Capljina', 'Gacko', 'Kakanj', 'Tuzla', 'Ugljevik']) and not (Country == 'EE' and Name in ['Kiisa Erpp', 'Iru Elektrijaam']) and not (Country == 'SE' and Name in ['Stenungsund', 'Nya Oresundsverket', 'Oresundsverket'])"
    custom_powerplants: "Country in ['NL', 'EE', 'FI', 'BA'] and (DateOut >= 2020 or DateOut != DateOut) and (DateIn <= 2020 or DateIn != DateIn)"
    estimate_renewable_capacities:
      year: 2020

  conventional:
    estimate_efficiencies:
      reference_year: 2020

  backcast:
    area_to_bus: data/entsoe_area_to_bus-pre2021.csv
    borders: data/entsoe_borders-pre2021.csv
    exclude_price_areas: [AL, BA, ME, MK, XK]
    max_capacity_gap_hours: 744  # EE-FI and FI-NO_4 offered capacities end 2020-12-01, FI-NO_4 has no scheduled exchanges
    fixed_border_capacities:
      AL-XK: physical
      BE-DE_LU: 0  # ALEGrO in market operation only from 2020-11-18
      BG-MK: physical
      DE_LU-NO_2: 0  # NordLink in trial operation only from 2020-12
      DK_1-GB: 0
      GB-NO_2: 0
      HU-SI: 0
      IT_CSUD-IT_ROSN: physical
      ME-XK: physical
      MK-XK: physical
      RS-XK: physical
    exchange_proxy_fallback: true  # AT-DE_LU NTC ends 2020-03-31, LT-LV offered capacity missing 2020-03-02 to 2020-05-01
    exclude_generation_areas: [AL, GB, SE_3, SE_4, XK]
    solar_calibration_exclude: [AT, BA, CH, GR, HR, IE_SEM, LV, ME, MK, NL, SE_1, SE_2, SI, IT_ROSN, LT]  # solar_calibration_exclude of config.backcast.yaml (keep in sync) plus IT_ROSN 0.04, LT 0.31
    wind_calibration_exclude:
      RO: [onwind]
    wind_calibration_factor_bounds: [0.35, 2.1]  # AT onwind needs 2.02 (2019: 1.96, 2023: 1.76, 2024: 1.92)
    wind_target_twh:
      GB: {onwind: 31.6, offwind: 40.7}  # DESNZ DUKES 2021 UK minus NI wind 3.10 TWh (DfE NI renewable generation statistics 2020: 3651 GWh, 84.9 % wind)
    wind_curtailment_twh:
      DE_LU: {onwind: 4.1, offwind: 1.8}  # BNetzA Monitoringbericht 2021, Tabelle 64: EinsMan 2020 onshore 4145 GWh, offshore 1797 GWh
    energy_budget_carriers: [biomass]  # annual biomass generation as e_sum_max per budget area (plan item 1.3)
    energy_budget_eurostat: [biomass]  # e_sum_max raised to Eurostat nrg_bal_peh gross biomass electricity (BIOE - W6210) where it exceeds ENTSO-E, as ENTSO-E misses autoproducer and small CHP biomass; dev/backcast-accuracy/p1-retune/biomass/diagnosis.md option A
    energy_budget_monthly_ceiling: false  # the annual cap alone, the monthly ENTSO-E p_max_pu ceiling would cap the raised budget again
    solar_unpublished: true  # grid-fed PV missing from ENTSO-E in data/solar_unpublished.csv, computed with the biomass budget raised to Eurostat (plan item 1.4)
    external_flows:
      areas: [UA, TR, RU, RU_KGD, BY]  # MD dropped: ENTSO-E publishes no RO-MD scheduled exchanges in 2020, only physical flows from 2020-01-17
    monthly_availability_exclude:
      biomass: [BE, BG, EE, FI, IT_CNOR, IT_CSUD, IT_NORD, IT_SARD, IT_SICI, IT_SUD, LT, LV, NL, PL, RS]  # ENTSO-E biomass below half of Eurostat nrg_bal_peh main-activity biomass electricity or load - generation - net scheduled imports above 5 % of load, dev/backcast-accuracy/p1-nuclear-biomass/coverage_2020.csv

backcast-2021:
  snapshots:
    start: "2021-01-01"
    end: "2022-01-01"

  atlite:
    default_cutout: europe-2021-sarah3-era5

  electricity:
    powerplants_filter: "(DateOut >= 2021 or DateOut != DateOut) and (DateIn <= 2021 or DateIn != DateIn) and not (Country == 'NL' and Name in ['Magnum Eemshaven', 'Claus', 'Eem', 'Velsen']) and not (Country == 'FI' and (Fueltype in ['Lignite', 'Nuclear'] or Name in ['Toppila Ja', 'Seinajoki', 'Haapaniemen', 'Keljonlahti', 'Alholmens Kraft', 'Naantali Chp'])) and not (Country == 'BA' and Name in ['Capljina', 'Gacko', 'Kakanj', 'Tuzla', 'Ugljevik']) and not (Country == 'EE' and Name in ['Kiisa Erpp', 'Iru Elektrijaam']) and not (Country == 'SE' and Name in ['Stenungsund', 'Nya Oresundsverket', 'Oresundsverket'])"
    custom_powerplants: "Country in ['NL', 'EE', 'FI', 'BA'] and (DateOut >= 2021 or DateOut != DateOut) and (DateIn <= 2021 or DateIn != DateIn)"
    estimate_renewable_capacities:
      year: 2021

  conventional:
    estimate_efficiencies:
      reference_year: 2021
    # THE daily prices start in 2021-10, before that THE countries keep the monthly price. They catch the gas spike of late December 2021.
    daily_gas_price:
      enable: true
      default_hub: THE
      hubs:
        ES: MIBGAS
        PT: MIBGAS
    country_fuel_price:
      coal:
        PL:  # domestic steam coal for power plants, ARP/TGE PSCMI-1 2021 average 11.31 PLN/GJ (Bogdanka FY2021 results) at the ECB 2021 average of 4.5652 PLN/EUR, against 10-24 EUR/MWh_th for the international price
          "2021-01-01": 8.92

  backcast:
    exclude_price_areas: [AL, BA, GB, ME, MK, XK]
    max_capacity_gap_hours: 744  # FI-NO_4 has no scheduled exchanges in January 2021, EE-FI, EE-LV, BG-GR, GR-MK and GB-IE_SEM have gaps of 3 to 13 days
    fixed_border_capacities:
      AL-XK: physical  # XK NTCs only from 2021-07-23
      BG-MK: physical  # no ENTSO-E capacity or exchange data in 2021
      DK_1-GB: 0
      GB-NO_2: 0  # North Sea Link in operation only from 2021-10-01
      HU-SI: 0  # no ENTSO-E capacity or exchange data in 2021
      IT_CALA-IT_CSUD: physical
      ME-XK: physical
      MK-XK: physical
      RS-XK: physical
    exclude_generation_areas: [AL, GB, SE_3]  # SE_3 nuclear generation is published only from 2021-12
    monthly_availability_carriers: [coal, lignite, biomass, waste]  # with gas at 70-180 EUR/MWh from September these ran at full availability in the model and displaced gas
    # ENTSO-E misses 5.4-43 % of the load in these countries (load - generation - net scheduled imports, 2021):
    # FI 11.2 TWh, SE (no CHP category), PL 13.9, DK 2.0, LV 3.1. XK generation is published only from 2021-08.
    # Their thermal fleets keep their availability, as calibrating to the published generation would drop real output.
    monthly_availability_exclude:
      coal: &incomplete-thermal-2021 [FI, SE_1, SE_2, SE_3, SE_4, PL, DK_1, DK_2, LV, XK]
      lignite: *incomplete-thermal-2021
      biomass: *incomplete-thermal-2021
      waste: *incomplete-thermal-2021
    wind_calibration_exclude:
      IT_CALA: [onwind]
    wind_calibration_factor_bounds: [0.35, 2.0]
    wind_target_twh:
      GB: {onwind: 26.8, offwind: 35.6}  # DESNZ ET 6.1 (Sep 2026) UK minus NI wind 2.57 TWh (DfE NI renewable generation statistics 2021: 3131 GWh, 82.1 % wind)
    wind_curtailment_twh:
      DE_LU: {onwind: 3.4, offwind: 2.1}  # BNetzA Bericht Netzengpassmanagement Gesamtes Jahr 2021, Tabelle 13: onshore 3408 GWh, offshore 2095 GWh

backcast-2022:
  snapshots:
    start: "2022-01-01"
    end: "2023-01-01"

  atlite:
    default_cutout: europe-2022-sarah3-era5

  electricity:
    powerplants_filter: "(DateOut >= 2022 or DateOut != DateOut) and (DateIn <= 2022 or DateIn != DateIn) and not (Country == 'NL' and Name in ['Magnum Eemshaven', 'Claus', 'Eem', 'Velsen']) and not (Country == 'FI' and (Fueltype in ['Lignite', 'Nuclear'] or Name in ['Toppila Ja', 'Seinajoki', 'Haapaniemen', 'Keljonlahti', 'Alholmens Kraft', 'Naantali Chp'])) and not (Country == 'BA' and Name in ['Capljina', 'Gacko', 'Kakanj', 'Tuzla', 'Ugljevik']) and not (Country == 'EE' and Name in ['Kiisa Erpp', 'Iru Elektrijaam']) and not (Country == 'SE' and Name in ['Stenungsund', 'Nya Oresundsverket', 'Oresundsverket'])"
    custom_powerplants: "Country in ['NL', 'EE', 'FI', 'BA'] and (DateOut >= 2022 or DateOut != DateOut) and (DateIn <= 2022 or DateIn != DateIn)"
    estimate_renewable_capacities:
      year: 2022

  conventional:
    estimate_efficiencies:
      reference_year: 2022
    gas_price_cap:  # Iberian exception, Real Decreto-ley 10/2022: 40 EUR/MWh from 2022-06-15 for six months, then 5 EUR/MWh more per month
      enable: true
      countries: [ES, PT]
      cap:
        "2022-06-15": 40
        "2022-12-14": 45
    # The World Bank monthly TTF overstates October and November 2022 (126 and 116 EUR/MWh against THE day-ahead means of 83 and 93) and misses the late-August spike to 311.
    daily_gas_price:
      enable: true
      default_hub: THE
      hubs:
        ES: MIBGAS
        PT: MIBGAS
    country_fuel_price:
      coal:
        PL:  # domestic steam coal for power plants, ARP/TGE PSCMI-1 2022 average 19.85 PLN/GJ (Bogdanka FY2022 results) at the ECB 2022 average of 4.6861 PLN/EUR, against about 37 EUR/MWh_th for the international price
          "2022-01-01": 15.25

  backcast:
    exclude_price_areas: [AL, BA, GB, ME, MK, XK]
    fixed_border_capacities:
      BG-MK: physical  # no ENTSO-E capacity data before 2022-06-15
      DK_1-GB: 0
      HU-SI: 0  # no ENTSO-E capacity or exchange data before Core flow-based market coupling on 2022-06-08
      IT_CALA-IT_CSUD: physical
    exchange_proxy_fallback: true  # Core NTCs end with flow-based market coupling on 2022-06-08, EE-FI, EE-LV and HU-RO offered capacities have gaps of 8 to 16 days
    exclude_generation_areas: [AL, GB]
    monthly_availability_carriers: [coal, lignite, biomass, waste]  # with gas at 100-340 EUR/MWh these ran at full availability in the model and displaced gas, e.g. Jul-Sep 110 TWh lignite and 45 TWh biomass against 67 and 19 TWh in ENTSO-E
    # ENTSO-E misses 6.6-9.3 % of the load in these countries (load - generation - net scheduled imports, 2022):
    # FI 5.3 TWh (peat and other CHP), SE 11.2 (no CHP category), PL 11.8 (industrial autoproducers), DK 2.9 (decentralised CHP), LV 0.6.
    # Their thermal fleets keep their availability, as calibrating to the published generation would drop real output.
    monthly_availability_exclude:
      coal: &incomplete-thermal [FI, SE_1, SE_2, SE_3, SE_4, PL, DK_1, DK_2, LV]
      lignite: *incomplete-thermal
      biomass: *incomplete-thermal
      waste: *incomplete-thermal
    wind_calibration_exclude:
      IT_CALA: [onwind]
      RS: [onwind]  # factor 2.93, ENTSO-E RS wind generation is published only from 2022-03
    wind_calibration_factor_bounds: [0.35, 2.0]
    wind_target_twh:
      GB: {onwind: 31.8, offwind: 45.1}  # DESNZ ET 6.1 (Sep 2026) UK minus NI wind 3.26 TWh (DfE NI renewable generation statistics 2022: 3825 GWh, 85.3 % wind)
    wind_curtailment_twh:
      DE_LU: {onwind: 3.2, offwind: 4.2}  # BNetzA Bericht Netzengpassmanagement Gesamtjahr 2022, Tabelle 7: onshore 3186 GWh, offshore 4153 GWh

backcast-2023:
