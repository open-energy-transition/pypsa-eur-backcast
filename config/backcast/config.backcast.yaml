# Day-ahead price backcast model shared by all years. The years are scenarios in
# config/backcast/scenarios.yaml; model changes go here so that all years run the same model.

run:
  name: all
  scenarios:
    enable: true
    file: config/backcast/scenarios.yaml

sector:
  enabled: false

electricity:
  extendable_carriers:
    Generator: []
    StorageUnit: []
    Store: []
    Link: []
  transmission_limit: v1.0
  cross_border_capacities: ntc
  estimate_renewable_capacities:
    from_powerplantmatching: false
    from_irenastat: true

renewable:
  hydro:
    flatten_dispatch: true
    flatten_dispatch_buffer: 0.2
    PHS_max_hours_cap: geth2015

conventional:
  dynamic_fuel_price: true
  fuel_price_rolling_window: 1
  fuel_price_nominal: true
  estimate_efficiencies:
    enable: true
  nuclear:
    p_min_pu: 0.3
  lignite:
    p_min_pu: 0.3
  biomass:
    p_min_pu: 0.3
  waste:
    p_min_pu: 0.5
  marginal_cost_spread:
    enable: true
    carriers: [CCGT, OCGT, coal, lignite, oil]
    spread: 0.45
    utilisation: 0.35
    reference: observed
    exclude_areas: [IE_SEM]

costs:
  year: 2020
  custom_cost_fn: config/backcast/custom_costs.backcast-2023.csv
  emission_prices:
    dynamic: true
    rolling_window: 1

transmission_projects:
  enable: false

lines:
  under_construction: zero

links:
  under_construction: zero

co2_budget:
  relative: false
  upper:
  lower:

clustering:
  mode: administrative
  administrative:
    level: bz
  build_bidding_zones:
    remove_islands: true
  copperplate_regions:
  - [DE00, LUG1]
  - [GBNI, IE00]
  consider_efficiency_classes: true
  cluster_network:
    allow_ac_dc_mixing_in_bus_clusters: true

solving:
  options:
    load_shedding:
      enable: true
      default_cost: 4000
    noisy_costs: false

backcast:
  exclude_price_buses: [FR15]
  max_price_gap_hours_by_area:
    IE_SEM: 25
  fixed_border_capacities:
    FI-SE_2: 0
    FR-IT_CNOR: physical
    FR-IT_SARD: physical
  exchange_proxy_borders: [BE-NL, DE_LU-NL]
  calibrate_wind: true
  wind_calibration_exclude:
    BA: [onwind]
    CH: [onwind]
    ES: [offwind]
    FR: [offwind]
    HR: [onwind]
    IT_CNOR: [onwind]
    IT_CSUD: [onwind]
    IT_NORD: [onwind]
    IT_SICI: [onwind]
    IT_SUD: [onwind, offwind]
    ME: [onwind]
    MK: [onwind]
    NL: [onwind]
    NO_2: [onwind]
    NO_3: [onwind]
    NO_5: [onwind]
    SI: [onwind]
    XK: [onwind]
  monthly_nuclear_availability: true
  hybrid_capacities:
    enable: true
    physical_factor: 0.49
    dc_physical_factor: 0.7
    sources: [scheduled_exchange]
    areas: [AT, BE, CZ, DE_LU, FR, HR, HU, NL, PL, RO, SI, SK]
